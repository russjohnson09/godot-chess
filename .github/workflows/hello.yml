name: Scheduled tests

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  schedule:
    # 3 AM EST is 8:00 AM UTC (or 7:00 AM UTC during EDT)
    - cron: "0 8 * * *"
  workflow_dispatch:
  push:
    branches:
      - 'auto/**'
      - 'feat/expirement-2'
    paths:
      - 'docs/TODO.md'
      - '.github/workflows/hello.yml'


permissions:
  contents: write
  # pull-requests: write

# https://docs.github.com/en/actions/how-tos/write-workflows/choose-where-workflows-run/run-jobs-in-a-container
# runs:
#   using: 'docker'
#   image: 'Dockerfile'

jobs:
  test:
    timeout-minutes: 15
    # runs-on: ubuntu-latest
    # E: Package 'libgl1-mesa-glx' has no installation candidate
    # runs-on: ubuntu-24 # godot support 
    # Installing libgl1 and libglx-mesa0 instead of libgl1-mesa-glx will result in equivalent behaviour and should work on Ubuntu 18.04 and newer.

    # https://askubuntu.com/questions/1517352/issues-installing-libgl1-mesa-glx
    
    # TODO push my Dockerfile to the public image repo
    runs-on: ubuntu-latest
    container:
      # https://stackoverflow.com/questions/61154750/use-local-docker-image-in-a-github-action
      # image: ${{ github.workspace }}/Dockerfile
      # https://hub.docker.com/r/barichello/godot-ci/
      #   Error response from daemon: failed to resolve reference "docker.io/barichello/godot-ci:4.3.0": docker.io/barichello/godot-ci:4.3.0: not found
      image: barichello/godot-ci:mono-latest
      options: --user root
      # credentials:
      #   username: ${{ github.actor }}
      #   password: ${{ secrets.GITHUB_TOKEN }}

    steps:
    # using v4 as a workaround but the git credentials need sharing on v5 v6
      - uses: actions/checkout@v5
        with:
            token: ${{ secrets.GITHUB_TOKEN }}
        # with:
          # ref: feat/expirement-2
          # default to 1 to not give the 
          # fetch-depth 0 gives full access to logs
          # fetch-depth: 0

      - name: Commit and push changes (sanity check)
        run: |
          echo "start"
          pwd
          echo "$PWD"
          git config --global --add safe.directory "$PWD"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "set username"
          git status
          #TARGET_BRANCH="${{ github.head_ref || github.ref_name }}"
          #git checkout "$TARGET_BRANCH"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -F COMMIT_MESSAGE.md
            # git push origin "HEAD:$TARGET_BRANCH"
            git push
          else
            echo "no changes"
          fi

      - name: Run tests
        run: |
          # Replace with your project’s test command
          echo "hi"

      - name: Set up Node.js from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Cache global node modules
        uses: actions/cache@v4
        id: npm-cache
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci
      # Gemini 3.5 Flash Lite
      - name: Run OpenCode implement
        env:
          # GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # https://aistudio.google.com/api-keys
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
                  # https://opencode.ai/docs/cli/commands/
          MODEL: ${{ vars.MODEL_NAME }}

        run: |
          # MODEL="${{ github.event.inputs.model || 'google/gemini-flash-lite-latest' }}"
          echo $MODEL
          WORK_DIR=$(pwd)
          echo $WORK_DIR
          INSTRUCTIONS_FILE="$WORK_DIR/TODO_INT.md"
          INSTRUCTIONS="Read and execute instructions in $INSTRUCTIONS_FILE"
          echo $INSTRUCTIONS_FILE
          echo $INSTRUCTIONS
          npx opencode run \
            --model "$MODEL" \
            --auto \
            "$INSTRUCTIONS"
          cat COMMIT_MESSAGE.md

      # Use 41898282 if you want the commit attributed to GitHub’s github-actions[bot] account. It’s that account’s ID, not an arbitrary placeholder. If you use another value, Git will still make the commit, but GitHub may attribute it differently or not link it to the bot account.
      # https://github.com/orgs/community/discussions/119597
      - name: Commit and push changes
        run: |
          echo "start"
          pwd
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "set username"
          git status
          #TARGET_BRANCH="${{ github.head_ref || github.ref_name }}"
          #git checkout "$TARGET_BRANCH"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -F COMMIT_MESSAGE.md
            # git push origin "HEAD:$TARGET_BRANCH"
            git push
          else
            echo "no changes"
          fi