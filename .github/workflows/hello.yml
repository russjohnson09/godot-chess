name: Scheduled tests

on:
  schedule:
    - cron: "17 3 * * *" # Daily at 03:17 UTC; change as needed
  workflow_dispatch:


permissions:
  contents: write
  # pull-requests: write


jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Cache Godot Snap / Installation & Build Cache
        uses: actions/cache@v4
        with:
          path: |
            /snap/godot-4
            /var/lib/snapd
            godot-chess/godot-chess/.godot
          key: ${{ runner.os }}-godot-snap-v1-${{ hashFiles('godot-chess/godot-chess/project.godot') }}
          restore-keys: |
            ${{ runner.os }}-godot-snap-v1-

      - name: Install Godot & Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg libgl1-mesa-dri libgl1-mesa-glx
          # https://github.com/Joshua-Riek/ubuntu-rockchip/issues/728
          # sudo apt-get update && sudo apt-get install -y ffmpeg
          sudo snap install godot-4 || sudo snap refresh godot-4

      - uses: actions/checkout@v6
        with:
          ref: feat/expirement-1
          # default to 1 to not give the 
          # fetch-depth 0 gives full access to logs
          # fetch-depth: 0

      - name: Run tests
        run: |
          # Replace with your project’s test command
          echo "hi"

      - name: Set up Node.js from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Cache global node modules
        uses: actions/cache@v4
        id: npm-cache
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci
      # Gemini 3.5 Flash Lite
      - name: Run OpenCode implement
        env:
          # GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # https://aistudio.google.com/api-keys
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
                  # https://opencode.ai/docs/cli/commands/

        run: |
          MODEL="${{ github.event.inputs.model || 'google/gemini-flash-lite-latest' }}"
          WORK_DIR=$(pwd)
          echo $WORK_DIR
          INSTRUCTIONS_FILE="$WORK_DIR/TODO_INT.md"
          INSTRUCTIONS="Read and execute instructions in $INSTRUCTIONS_FILE"
          echo $INSTRUCTIONS_FILE
          echo $INSTRUCTIONS
          npx opencode run \
            --model "$MODEL" \
            --auto \
            "$INSTRUCTIONS"
          cat COMMIT_MESSAGE.md

      # Use 41898282 if you want the commit attributed to GitHub’s github-actions[bot] account. It’s that account’s ID, not an arbitrary placeholder. If you use another value, Git will still make the commit, but GitHub may attribute it differently or not link it to the bot account.
      # https://github.com/orgs/community/discussions/119597
      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            # git commit -m "Update generated files"
            git commit -F COMMIT_MESSAGE.md
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "no changes"
          fi