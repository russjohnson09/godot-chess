name: Build Rust GDExtension

on:
  workflow_dispatch:
  push:
    paths:
      - "rust/example_extension/**"
      - ".github/workflows/build-extensions.yml"
    branches: [main, feat/rust-godot-extension]

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: rust/example_extension
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            extension: dll

          - name: ubuntu-x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            extension: so

          - name: android-arm64
            runner: ubuntu-latest
            target: aarch64-linux-android
            extension: so

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Android NDK
        if: matrix.name == 'android-arm64'
        uses: android-actions/setup-android@v4

      - name: Install NDK and cargo-ndk
        if: matrix.name == 'android-arm64'
        shell: bash
        run: |
          sdkmanager "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
          cargo install cargo-ndk --locked

      - name: Build Windows and Ubuntu
        if: matrix.name != 'android-arm64'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build Android
        if: matrix.name == 'android-arm64'
        run: cargo ndk -t arm64-v8a build --release

      - name: Upload native library
        uses: actions/upload-artifact@v4
        with:
          name: godot-extension-${{ matrix.name }}
          # path: target/${{ matrix.target }}/release/*.${{ matrix.extension }}
          # That path is relative to the repository root, unlike the run steps’ working directory.
          path: rust/example_extension/target/${{ matrix.target }}/release/*.${{ matrix.extension }}
          if-no-files-found: error