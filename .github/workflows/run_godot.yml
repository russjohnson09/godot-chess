name: "Run Godot App"

on:
  # push:
  #   branches: [ main, master ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-godot:
    name: Run Godot Game in Headless Mode
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Cache Godot Snap / Installation & Build Cache
        uses: actions/cache@v4
        with:
          path: |
            /snap/godot-4
            /var/lib/snapd
            godot-chess/godot-chess/.godot
          key: ${{ runner.os }}-godot-snap-v1-${{ hashFiles('godot-chess/godot-chess/project.godot') }}
          restore-keys: |
            ${{ runner.os }}-godot-snap-v1-

      - name: Install Godot & Dependencies
        run: |
          # sudo apt-get update && sudo apt-get install -y ffmpeg libgl1-mesa-dri libgl1-mesa-glx
          sudo apt-get update && sudo apt-get install -y ffmpeg
          sudo snap install godot-4 || sudo snap refresh godot-4


      - name: Run Godot Scene
        run: |
          cd godot-chess/godot-chess
          godot-4 --headless --quit-after 10 entry_2.tscn

# Movie Maker mode enabled, recording movie in 1152×648 @ 60 FPS...
# ERROR: Parameter "t" is null.
#    at: texture_2d_get (./servers/rendering/dummy/storage/texture_storage.h:110)
      - name: Run Godot Scene
        run: |
          cd godot-chess/godot-chess
          godot-4 --write-movie output_entry2.avi --fixed-fps 60 --headless --quit-after 10 entry_2.tscn

      - name: Upload Recording Artifact
        uses: actions/upload-artifact@v4
        with:
          name: output-entry2-recording
          path: godot-chess/godot-chess/output_entry2.avi