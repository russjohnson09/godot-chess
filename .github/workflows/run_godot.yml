name: "Run Godot App"

on:
  # push:
  #   branches: [ main, master ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-godot:
    name: Run Godot Game in Headless Mode
    runs-on: ubuntu-latest
    
    steps:
      - name: Install Godot
        run: |
          sudo snap install godot-4

      - name: Checkout Repository
        uses: actions/checkout@v4


      - name: Run Godot Scene
        run: |
          cd godot-chess/godot-chess
          godot-4 --headless --quit-after 10 entry_2.tscn

